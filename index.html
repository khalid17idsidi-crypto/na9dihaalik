<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق التسخير والتوصيل - التفاوض المباشر</title>
    
    <!-- خط Tajawal وتنسيقات الخريطة -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --primary: #10b981; /* أخضر inDrive/توصيل */
            --primary-dark: #059669;
            --accent: #ff5722;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #020617; color: var(--text-main); display: flex; justify-content: center; }

        .app-container {
            width: 100%; max-width: 480px; height: 100vh; background: var(--bg-dark);
            position: relative; overflow: hidden; display: flex; flex-direction: column;
        }

        /* 1. طبقة الخريطة تغطي الخلفية */
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 2. شريط سفلي قابل للتغيير (Bottom Sheet) */
        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
            background: var(--card-bg); border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); border-top: 1px solid var(--border);
            max-height: 85vh; overflow-y: auto; transition: all 0.4s ease;
        }

        .sheet-handle { width: 40px; height: 5px; background: var(--text-muted); border-radius: 10px; margin: 0 auto 15px auto; opacity: 0.5; }

        /* تبويب نوع الخدمة */
        .service-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 12px;
            background: rgba(255,255,255,0.05); color: var(--text-muted); font-size: 12px; font-weight: 700;
            cursor: pointer; transition: 0.3s; text-align: center;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* الحقول والنصوص */
        .field-group { margin-bottom: 12px; }
        .field-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .field-group input, .field-group textarea {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6); color: white; font-size: 13px; outline: none;
        }
        .field-group textarea { resize: none; height: 60px; }

        /* تحديد الأجرة */
        .fare-box { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--primary); padding: 12px; border-radius: 14px; margin-bottom: 15px; }
        .fare-input-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        .fare-input-wrapper input { font-size: 18px; font-weight: 800; text-align: center; color: var(--primary); }
        .quick-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }

        .btn-submit {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        /* 3. شاشة العروض والتفاوض */
        .radar-box { text-align: center; padding: 20px 0; display: none; }
        .radar-spinner {
            width: 60px; height: 60px; border: 4px solid rgba(16, 185, 129, 0.2);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* بطاقة الموصل */
        .driver-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 14px;
            border-radius: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;
        }
        .driver-info { display: flex; align-items: center; justify-content: space-between; }
        .driver-profile { display: flex; align-items: center; gap: 10px; }
        .driver-avatar { width: 42px; height: 42px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .driver-actions { display: flex; gap: 8px; }
        .btn-accept { flex: 2; padding: 10px; background: var(--primary); border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; }
        .btn-counter { flex: 1; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 11px; cursor: pointer; }

        /* شاشة التتبع */
        .tracking-box { display: none; text-align: center; }
        .otp-badge { background: #334155; padding: 8px 16px; border-radius: 20px; font-weight: 800; color: #f59e0b; display: inline-block; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الخريطة -->
        <div id="map"></div>

        <!-- اللوحة السفلية -->
        <div class="bottom-sheet" id="bottomSheet">
            <div class="sheet-handle"></div>

            <!-- المرحلة 1: إدخال طلب التسخيرة -->
            <div id="stepOrderForm">
                <div class="service-tabs">
                    <button class="tab-btn active" onclick="setTab(this)">🛒 شراء مستلزمات</button>
                    <button class="tab-btn" onclick="setTab(this)">📦 نقل طرد / وثيقة</button>
                </div>

                <div class="field-group">
                    <label>🟢 مكان الأخذ / المتجر</label>
                    <input type="text" id="pickupPos" value="مرجان - شارع الجيش الملكي">
                </div>

                <div class="field-group">
                    <label>🔴 عنوان التسليم</label>
                    <input type="text" id="deliveryPos" placeholder="حدد عنوانك المستهدف...">
                </div>

                <div class="field-group">
                    <label>📝 قائمة المشتريات / تفاصيل الإرسالية</label>
                    <textarea placeholder="اكتب التفاصيل هنا (مثال: حليب، خبز، زبدة...)"></textarea>
                </div>

                <div class="fare-box">
                    <label style="font-size: 11px; color: var(--text-muted);">💰 الأجرة المقترحة للتوصيل (درهم)</label>
                    <div class="fare-input-wrapper">
                        <input type="number" id="offeredFare" value="20">
                        <button class="quick-btn" onclick="addFare(5)">+5</button>
                        <button class="quick-btn" onclick="addFare(10)">+10</button>
                    </div>
                </div>

                <button class="btn-submit" onclick="startBargaining()">اطلب الآن و أرسل للموصلين 🚀</button>
            </div>

            <!-- المرحلة 2: الرادار وعروض التفاوض -->
            <div id="stepBargaining" class="radar-box">
                <div class="radar-spinner"></div>
                <h3 style="font-size: 15px; margin-bottom: 5px;">جارٍ البحث عن موصل قريب...</h3>
                <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 15px;">تم إرسال طلبك لعشرات الموصلين بالمنطقة</p>

                <!-- العروض المتلقاة -->
                <div id="offersList"></div>
            </div>

            <!-- المرحلة 3: التتبع المباشر -->
            <div id="stepTracking" class="tracking-box">
                <h3 style="font-size: 16px; color: var(--primary);">🛵 الموصل في الطريق إليك!</h3>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">يقوم بجمع الطلبات الآن</p>
                
                <div class="otp-badge">رمز تأكيد الاستلام (OTP): 4821</div>
                
                <p style="font-size: 11px; color: var(--text-muted);">مزّد الموصل بهذا الرمز فور استلام تسخيرتك لتأكيد العملية.</p>
                <button class="btn-submit" style="margin-top: 15px; background: #334155;" onclick="resetApp()">إلغاء أو إنهاء الطلب</button>
            </div>
        </div>
    </div>

    <script>
        // 1. تهيئة الخريطة التفاعلية
        const map = L.map('map', { zoomControl: false }).setView([33.5731, -7.5898], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        // إضافة مؤشرات وهمية للمتجر والمستلم
        L.marker([33.5731, -7.5898]).addTo(map).bindPopup("🟢 مكان التسخيرة").openPopup();
        L.marker([33.5850, -7.6100]).addTo(map).bindPopup("🔴 نقطة الوصول");

        // 2. التحكم في التبويبات والأجرة
        function setTab(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function addFare(amount) {
            const input = document.getElementById('offeredFare');
            input.value = parseInt(input.value || 0) + amount;
        }

        // 3. بدء عملية التفاوض وبث العروض
        function startBargaining() {
            document.getElementById('stepOrderForm').style.display = 'none';
            document.getElementById('stepBargaining').style.display = 'block';

            // محاكاة وصول عروض من موصلين بعد ثوانٍ
            setTimeout(() => {
                const offersContainer = document.getElementById('offersList');
                const offeredFare = document.getElementById('offeredFare').value;

                offersContainer.innerHTML = `
                    <div class="driver-card">
                        <div class="driver-info">
                            <div class="driver-profile">
                                <div class="driver-avatar">🛵</div>
                                <div style="text-align: right;">
                                    <div style="font-weight: 800; font-size: 13px;">ياسين العبدلاوي</div>
                                    <div style="font-size: 11px; color: #f59e0b;">★ 4.9 (85 توصيلة)</div>
                                </div>
                            </div>
                            <div style="text-align: left;">
                                <div style="font-size: 16px; font-weight: 800; color: var(--primary);">${offeredFare} د.م</div>
                                <div style="font-size: 10px; color: var(--text-muted);">10 دقائق وصول</div>
                            </div>
                        </div>
                        <div class="driver-actions">
                            <button class="btn-accept" onclick="acceptOffer()">قبول العرض ✅</button>
                            <button class="btn-counter" onclick="alert('تم إرسال عرض مضاد بـ 5 دراهم إضافية')">طلب +5 د.م</button>
                        </div>
                    </div>

                    <div class="driver-card">
                        <div class="driver-info">
                            <div class="driver-profile">
                                <div class="driver-avatar">🚲</div>
                                <div style="text-align: right;">
                                    <div style="font-weight: 800; font-size: 13px;">حمزة كريم</div>
                                    <div style="font-size: 11px; color: #f59e0b;">★ 4.8 (40 توصيلة)</div>
                                </div>
                            </div>
                            <div style="text-align: left;">
                                <div style="font-size: 16px; font-weight: 800; color: #f59e0b;">${parseInt(offeredFare) + 5} د.م</div>
                                <div style="font-size: 10px; color: var(--text-muted);">عرض مضاد</div>
                            </div>
                        </div>
                        <div class="driver-actions">
                            <button class="btn-accept" onclick="acceptOffer()">قبول بـ ${parseInt(offeredFare) + 5} د.م ✅</button>
                        </div>
                    </div>
                `;
            }, 1500);
        }

        // 4. قبول العرض والانتقال للتتبع
        function acceptOffer() {
            document.getElementById('stepBargaining').style.display = 'none';
            document.getElementById('stepTracking').style.display = 'block';
        }

        function resetApp() {
            document.getElementById('stepTracking').style.display = 'none';
            document.getElementById('stepBargaining').style.display = 'none';
            document.getElementById('stepOrderForm').style.display = 'block';
            document.getElementById('offersList').innerHTML = '';
        }
    </script>
</body>
</html>
